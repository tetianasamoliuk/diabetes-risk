[project]
name = "diabetes-risk"
version = "0.1.0"
description = "Визначення ризиків захворювань на основі можливих факторів впливу"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "statsmodels",
    "scikit-learn",
    "shap",
    "matplotlib",
    "openpyxl",
    "pyarrow",
    "joblib",
    "streamlit",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risk"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "ANN", "D", "RUF100"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"app/**" = ["E402"]
"tests/**" = ["E402", "D103"]

[tool.ruff.lint.isort]
known-first-party = ["risk", "_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: інтеграційні тести на реальній когорті (потрібні дані)"]
addopts = "-ra -m 'not slow'"

[tool.coverage.run]
source = ["src/risk"]
branch = true

[tool.coverage.report]
fail_under = 95
